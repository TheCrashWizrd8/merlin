# ---------------------------------------------------------------------------
# Model configuration
# ---------------------------------------------------------------------------
# architecture: any Ultralytics model string, e.g.
#   yolov8n  yolov8s  yolov8m  yolov8l  yolov8x
#   yolov8n-seg  yolov8s-seg   (instance segmentation)
#   yolov9c  yolov9e
#   yolo11n  yolo11s  yolo11m
# Ignored when `weights` points at a trained .pt — the checkpoint defines the net.
architecture: yolov8n

# task: detect | segment | auto
# Currently deployed: detect (weights/best.pt). Set segment when you add a *-seg .pt.
task: detect

# backend: inference runtime. The Hailo-8L HAT is the intended accelerator.
#   hailo    — HailoRT. Compile the .hef on a Linux x86_64 PC with Hailo DFC 3.x
#              (scripts/export_model.py --format hailo or compile_hailo_hef.sh),
#              copy weights/<stem>_hailo_model/ back here, then switch to this.
#   ncnn     — CPU fallback (works today without a .hef)
#   pytorch  — Ultralytics .pt (slowest on Pi)
#   openvino — Intel-optimised; usable on Pi but usually slower than ncnn
backend: hailo

# weights: path to a .pt file to resume training or run inference.
# Leave blank to train from the Ultralytics pretrained backbone.
# On the Pi point this to weights/best.pt after training.
# For ncnn/openvino, export once (see scripts/export_model.py); inference loads
# the sibling directory, e.g. weights/best_ncnn_model/ or best_openvino_model/.
# After swapping a new .pt you MUST re-export — the old folder is not updated:
#   python scripts/export_model.py --format ncnn
weights: "weights/best_hailo_model/best.hef"

# Which catalog entry loads at startup (see models: below).
active_model: gate

# Switchable models for Auto (YOLO) mode on the /sub/ dashboard.
# Only list weights you have on disk. Add a new block when you import a .pt;
# missing files grey out the button but do not block startup.
models:
  detect:
    label: "Detect"
    weights: weights/best.pt
    task: detect
    track_label: apple
  gate:
    label: "Gate"
    weights: weights/gatebest.pt
    task: segment
    track_label: gate

# Detection thresholds
confidence: 0.50
iou: 0.45

# Input image size fed to the model (pixels, square).
# 640 = better far/small apples (preferred). 320 = faster, misses distant fruit.
# Re-export NCNN after changing:
#   python scripts/export_model.py --format ncnn
img_size: 640

# NCNN threads. 3 leaves one Pi 5 core for USB/ESP so YOLO isn't fighting
# the grabber (4 threads at 70% often means contention, not spare capacity).
ncnn_threads: 3

# Training hyperparameters (used by train.py, ignored during inference)
epochs: 50
batch_size: 16          # reduce to 8 if running on a machine with <8 GB VRAM
