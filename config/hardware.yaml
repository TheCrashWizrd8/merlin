# ---------------------------------------------------------------------------
# Hardware configuration
# ---------------------------------------------------------------------------
# cameras: number of cameras (1–3). Size-based distance uses single-cam for now.
# Multi-camera triangulation positions TBD.
# ---------------------------------------------------------------------------
cameras:
  num_cameras: 1   # max 3; positions configured later for triangulation

# ---------------------------------------------------------------------------
# interface: the physical layer used to drive actuators.
#   "stub"  — no hardware; commands are printed only (default for dev)
#   "sub"   — sub_rc over USB/GPIO UART via esp_bridge (S2/B/TEL)
#
# Set to "stub" while developing so inference.py runs without hardware.
# ---------------------------------------------------------------------------
interface: sub

# Sub vehicle serial (Pi USB ↔ ESP32 sub_rc.ino)
sub_serial:
  port: "/dev/ttyACM0"  # ESP32-S3 USB; use ttyUSB0 if that appears instead
  baud_rate: 115200

# ---------------------------------------------------------------------------
# Xbox / gamepad (sub stack only — started by sub_server.py or inference --sub)
# Plug in via USB or pair over Bluetooth; no extra setup scripts required.
# Verify: python -m src.xbox_controller
# ---------------------------------------------------------------------------
xbox:
  enabled: true         # set false to skip gamepad polling (same as --no-xbox)
  deadzone: 0.18        # circular stick deadzone (0–1); raise if sticks drift at rest
  trigger_deadzone: 0.08 # ignore LT/RT below this (prevents ghost fill)
  smoothing_alpha: 0.35  # EMA on sticks (0=off); use with stick_hold_ms below
  stick_hold_ms: 120     # ignore brief zero reads while stick held (fixes BT jitter)
  release_alpha: 0.55    # decay speed when stick returns to centre
  poll_hz: 30           # read rate while connected
  scan_interval_s: 2.0  # how often to retry when no pad is found
  mapping_file: config/xbox_mapping.yaml
  # device_index: 0     # omit to auto-pick (prefers Xbox-named devices)

# ---------------------------------------------------------------------------
# Control scaling
# All ControlOutput values are in the range -1.0 to +1.0.
# The sub stack maps these to actuator commands via sub_control.py.
# ---------------------------------------------------------------------------
deadzone: 0.02        # smaller deadzone = reacts to smaller target movement
gain_steer: 1.8       # >1.0 makes steering respond more aggressively
gain_tilt: 1.4        # >1.0 makes camera tilt react more strongly
max_drive_speed: 0.9  # cap forward speed at 90%
min_steer_command: 0.25  # keep steering moving until centred (no tiny pulses)
min_tilt_command: 0.18   # keep tilt correcting until centred
min_drive_command: 0.55  # keep sub moving; raise if thruster still barely moves
min_detection_confidence: 0.45  # ignore weaker detections (jitter/noise)
hold_missed_frames: 5           # persist last valid target briefly on dropouts
smoothing_alpha: 0.30           # EMA smoothing (lower = smoother, slower)
damping_steer: 0.22             # derivative damping for steering overshoot
damping_tilt: 0.18              # derivative damping for tilt overshoot
max_drive_when_turning: 0.55    # min drive while turning; raise for more power

# ---------------------------------------------------------------------------
# Size-based distance (bbox area → drive D)
# Farther = smaller bbox → more forward drive; closer = larger bbox → less drive (creep in).
# size_drive_far / size_drive_close: full -1..+1 for D (defaults 1.0 → 0.0 use the whole motor range).
# size_min_ratio / size_max_ratio: MUST bracket the HUD "Size" values you actually see, or t stays
#   mid-range and D only wiggles (e.g. 0.6–0.8). Example: if Size stays ~0.02–0.05, set min 0.018
#   and max 0.052 so t can run 0→1 as you drive from far to close.
# ---------------------------------------------------------------------------
use_size_for_drive: true
size_drive_far: 1.0             # D when apple is small in frame (far)
size_drive_close: 0.0           # D when apple is large (close); bump to ~0.08 if motor needs min torque
size_min_ratio: 0.015           # bbox/frame at/under this → size_drive_far (tune to your “far” HUD Size)
size_max_ratio: 0.055           # bbox/frame at/over this → size_drive_close (tune to your “close” HUD Size)
size_smoothing_alpha: 0.22
size_curve: sqrt                # linear | sqrt

# ---------------------------------------------------------------------------
# Telemetry safety (does not steer — drive/steer/tilt come from the camera)
# When interface: sub, inference passes live ESP data; only leak/battery affect drive.
# ---------------------------------------------------------------------------
approach:
  use_telemetry: true
  stop_on_leak: true
  min_battery_v: 10.5
  low_battery_drive_scale: 0.45
  max_error_x_for_drive: 0.40   # steer toward centre before full forward
  max_error_y_for_drive: 0.45

# ---------------------------------------------------------------------------
# Sub motion layering (auto mode): fins → aft steer → thruster + ballast height
# Camera drives intent; gyro levels body; ballast adjusts when apple is above/below.
# error_y > 0 = apple below centre → fill (sink); error_y < 0 → drain (rise)
# ---------------------------------------------------------------------------
sub_motion:
  level_roll_gain: 0.035          # fin command per degree roll
  level_pitch_gain: 0.025
  max_fin_command: 0.85
  max_roll_deg: 12.0
  max_pitch_deg: 10.0
  require_level_for_steer: true
  require_level_for_drive: true
  use_ballast_for_height: true
  ballast_height_gain: 0.55
  ballast_error_deadzone: 0.12
  ballast_max_command: 1.0
