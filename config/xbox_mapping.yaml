# ---------------------------------------------------------------------------
# Xbox controller → sub actuator mapping
#
# Edit this file to change bindings without touching Python code.
# Verify: python -m src.xbox_controller
#
# Stick drift: tune xbox.deadzone in config/hardware.yaml (default 0.18).
# Per-stick override: sticks.left.deadzone / sticks.right.deadzone below.
# ---------------------------------------------------------------------------

# Path override (optional — default is this file)
# mapping_file: config/xbox_mapping.yaml

sticks:

  left:
    # Aft steering / actuator movement
    # Left/right = X movement
    # Up/down    = Y movement
    aft_steer_x: x
    aft_steer_y: y
    invert_y: false
    invert_x: false

  right:
    # Flap control
    #
    # Up    → both fore flaps up
    # Down  → both fore flaps down
    # Left  → roll left using fore flaps
    # Right → roll right using fore flaps
    #
    # Neutral → flaps neutral
    mode: flaps

    up: both_flaps_up
    down: both_flaps_down
    left: roll_left
    right: roll_right


buttons:
  # SDL / Linux joystick button indices (Xbox over Bluetooth)

  rb: 5   # RB — ballast up
  lb: 4   # LB — ballast down

  # D-pad
  dpad_left: dpad_left
  dpad_up: dpad_up
  dpad_down: dpad_down


triggers:
  # Thrust
  rt: forward
  lt: reverse


ballast:
  # Normal operation:
  # RB → ballast up
  # LB → ballast down
  #
  # D-pad up + RB/LB:
  #   RB → fore ballast up
  #   LB → fore ballast down
  #
  # D-pad down + RB/LB:
  #   RB → aft ballast up
  #   LB → aft ballast down

  up_button: rb
  down_button: lb

  dpad_up_tank: fore
  dpad_down_tank: aft
  default_tank: both

  up_magnitude: 1.0
  down_magnitude: 1.0


thruster:
  # RT → forward thrust
  # LT → reverse thrust

  forward_trigger: rt
  reverse_trigger: lt

  forward_magnitude: 1.0
  reverse_magnitude: 1.0


flaps:
  # Right stick
  #
  # Up    → both flaps up
  # Down  → both flaps down
  # Left  → roll left using fore flaps
  # Right → roll right using fore flaps

  mode: normal

  both_up_axis: y
  roll_axis: x

  invert_y: false
  invert_x: false


emergency_stop:
  # B — immediately stop YOLO, zero all actuators/ballast, hand control to the pad.
  enabled: true
  button: b

modes:
  # Clicking LEFT on the D-pad enables linked flap mode.

  linked_flap:
    button: dpad_left   # press to toggle linked flap on/off
    toggle: true
    default_on: true    # fins oppose aft steer axis (Xbox + YOLO auto); not tied to RT/LT
    gain: 1.0
    replace_stick: true # when linked: RS flaps off; fins follow aft steer only
    angle_deadzone: 0.05


leak:
  # When a leak is detected, continuously rumble the controller motors.

  rumble_on_leak: true
  rumble_constant: true